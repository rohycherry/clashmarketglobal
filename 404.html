<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found</title>

    <link rel="icon" href="/favicon.ico">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 100px 20px;
        }

        h1 {
            font-size: 70px;
            margin: 0 0 10px;
        }

        h2 {
            font-size: 24px;
            font-weight: normal;
            margin: 0 0 15px;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>404</h1>

    <h2>Page Not Found</h2>

    <p>The page you are looking for could not be found.</p>

    <a href="/">← Back to Home</a>

</div>

</body>
</html>
